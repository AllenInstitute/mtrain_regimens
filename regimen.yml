### mtrain definitions
name: Openscope_Loop_v7

transitions:

  - trigger: progress
    source: DAY_6
    dest: DAY_7
    conditions: one_complete

  - trigger: progress
    source: DAY_7
    dest: DAY_8
    conditions: one_complete

  - trigger: progress
    source: DAY_8
    dest: DAY_9
    conditions: one_complete

  - trigger: progress
    source: DAY_9
    dest: DAY_10
    conditions: one_complete

  - trigger: manual
    source: DAY_10
    dest: GROUPA_60MIN_DAY1_2

  - trigger: manual
    source: GROUPA_60MIN_DAY1_2
    dest: GROUPA_90MIN_DAY3_4

  - trigger: manual
    source: GROUPA_90MIN_DAY3_4
    dest: GROUPA_120MIN_DAY5

  - trigger: manual
    source: GROUPA_120MIN_DAY5
    dest: EPHYS_GROUPA_LOOP

  - trigger: manual
    source: DAY_10
    dest: GROUPB_60MIN_DAY1_2

  - trigger: manual
    source: GROUPB_60MIN_DAY1_2
    dest: GROUPB_90MIN_DAY3_4

  - trigger: manual
    source: GROUPB_90MIN_DAY3_4
    dest: GROUPB_120MIN_DAY5

  - trigger: manual
    source: GROUPB_120MIN_DAY5
    dest: EPHYS_GROUPB_LOOP

  - trigger: manual
    source: EPHYS_GROUPB_LOOP
    dest: TEST_LOOP

stages:
    DAY_6:
        script: *day_6_script
        script_md5: *day_6_script_md5
        parameters:
