### mtrain definitions
#based on VisualBehavior_Task1A_v1.0.3
name: VisualBehaviorEPHYS_sev_v0.0.5

transitions:
- trigger: manual
  source: HABITUATION_5_images_G_handoff_ready_5uL_reward
  dest: EPHYS_day_1

- trigger: manual
  source: HABITUATION_5_images_G_handoff_ready_3uL_reward
  dest: EPHYS_day_1

- trigger: progress
  source: EPHYS_day_1
  dest: EPHYS_day_2
  conditions: one_complete

- trigger: progress
  source: EPHYS_day_2
  dest: EPHYS_day_3
  conditions: one_complete

- trigger: progress
  source: EPHYS_day_3
  dest: EPHYS_day_4
  conditions: one_complete

stages:
  HABITUATION_5_images_G_handoff_ready_5uL_reward:
    script: *change_detection_script
    script_md5: *change_detection_script_md5
    parameters:
      <<: *image_set_g_parameters
      stage: HABITUATION_5_images_G_handoff_ready_5uL_reward
      warm_up_trials: 5
      reward_volume: 0.005
      free_reward_trials: 10
      max_mapping_duration_min: 10
      disable_replay: true
      disable_opto: true
      opto_params:
        operation_mode: experiment

      # ephys-specific no grayscreen pre-exp time
      start_padding_windowless: 20.0

  HABITUATION_5_images_G_handoff_ready_3uL_reward:
    script: *change_detection_script
    script_md5: *change_detection_script_md5
    parameters:
      <<: *image_set_g_parameters
      stage: HABITUATION_5_images_G_handoff_ready_3uL_reward
      warm_up_trials: 5
      reward_volume: 0.003
      free_reward_trials: 10
      max_mapping_duration_min: 10
      disable_replay: true
      disable_opto: true
      opto_params:
        operation_mode: experiment

      # ephys-specific no grayscreen pre-exp time
      start_padding_windowless: 20.0

  EPHYS_day_1:
    script: *replay_script
    script_md5: *replay_script_md5
    parameters:
      <<: *replay_g_parameters
      stage: EPHYS_day_1
      warm_up_trials: 3
      flash_omit_probability: 0.05
      reward_volume: 0.003
      max_mapping_duration_min: 35
      opto_params:
        operation_mode: experiment

  EPHYS_day_2:
    script: *replay_script
    script_md5: *replay_script_md5
    parameters:
      <<: *replay_h_parameters
      stage: EPHYS_day_2
      warm_up_trials: 3
      flash_omit_probability: 0.05
      reward_volume: 0.003
      max_mapping_duration_min: 35
      opto_params:
        operation_mode: experiment

  EPHYS_day_3:
    script: *replay_script
    script_md5: *replay_script_md5
    parameters:
      <<: *replay_h_parameters
      stage: EPHYS_day_3
      warm_up_trials: 3
      flash_omit_probability: 0.05
      reward_volume: 0.003
      max_mapping_duration_min: 35
      opto_params:
        operation_mode: experiment

  EPHYS_day_4:
    script: *replay_script
    script_md5: *replay_script_md5
    parameters:
      <<: *replay_k_parameters
      stage: EPHYS_day_4
      warm_up_trials: 3
      flash_omit_probability: 0.05
      reward_volume: 0.003
      max_mapping_duration_min: 35
      opto_params:
        operation_mode: experiment