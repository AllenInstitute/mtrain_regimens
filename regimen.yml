_fingerprint_movie: &fingerprint_movie
    name: fingerprint
    params:
        movie_path: //allen/programs/braintv/workgroups/neuralcoding/Saskia/Visual Stimuli 151207/Movie_TOE1.npy
        frame_length: 0.03333333333333333
        size: [1920, 1080]
        runs: 10


_flash_parameters: &flash_parameters
    task_id: DoC

    catch_frequency: 0.25
    failure_repeats: 5

    # rewards (mL)
    reward_volume: 0.007
    volume_limit: 5.0

    # auto rewards
    auto_reward_vol: 0.005
    warm_up_trials: 5
    auto_reward_delay: 0.150
    free_reward_trials: 10

    # trial timing
    min_no_lick_time: 0.0
    timeout_duration: 0.3
    pre_change_time: 0.0
    stimulus_window: 6.0
    max_task_duration_min: 60.0
    start_stop_padding: 20.0
    periodic_flash: [0.25, 0.5]
    response_window: [0.15,0.75]
    end_after_response: True
    end_after_response_sec: 3.5

    # timing of changes
    change_time_dist: geometric
    change_time_scale: 0.3
    change_flashes_min: 4  # inclusive
    change_flashes_max: 12  # exclusive

_no_flash_parameters: &no_flash_parameters
    <<: *flash_parameters
    periodic_flash: null
    response_window: [0.15,1.0]
    reward_volume: 0.010
    free_reward_trials: 10
    pre_change_time: 2.25

    # timing of changes
    change_time_dist: exponential
    change_time_scale: 2.0
    change_flashes_min: null
    change_flashes_max: null


_image_set_a_parameters: &image_set_a_parameters
    <<: *flash_parameters
    stimulus: *image_set_a
    catch_frequency: null

_image_set_b_parameters: &image_set_b_parameters
    <<: *flash_parameters
    stimulus: *image_set_b
    catch_frequency: null

_image_set_c_parameters: &image_set_c_parameters
    <<: *flash_parameters
    stimulus: *image_set_c
    catch_frequency: null

_image_set_d_parameters: &image_set_d_parameters
    <<: *flash_parameters
    stimulus: *image_set_d
    catch_frequency: null

_image_set_g_parameters: &image_set_g_parameters
    <<: *flash_parameters
    stimulus: *image_set_g
    catch_frequency: null

_image_set_h_parameters: &image_set_h_parameters
    <<: *flash_parameters
    stimulus: *image_set_h
    catch_frequency: null

### mtrain definitions

# based on VisualBehavior_Task1A_v1.1.1 and modified in the following ways for learning experiments:
# added 5 min gray screen + fingerprint movie to all sessions
# removed "handoff_ready" and "handoff_lapsed" stages as mice are trained continuously on the rig and there is no handoff
# also renamed "OPHYS_" sessions to start with "TRAINING_" since there is no longer a distinction - all training sessions happen on ophys rig
# use more stringent transition criteria (added meets_engagement_criteria in addition to peak d-prime >2)
# reduced reward volume in TRAINING_1 to 0.007ml (instead of 0.01), then to 0.005 in TRAINING_4 (instead of 0.007) then to 0.003 in TRAINING_5 and therafter
# keep autorewards to 5 in all sessions, remove free rewards entirely

name: Learning_V1omFISH_v1.0.4

# potential further changes: 
# addition of zebra noise stimulus instead of or in addition to fingerprint stim

transitions:

  - trigger: progress
    source: TRAINING_0_gratings_autorewards_15min
    dest: TRAINING_1_gratings_static
    conditions: one_complete

  - trigger: progress
    source: TRAINING_1_gratings_static
    dest: TRAINING_2_gratings_flashed
    conditions: [two_out_of_three_aint_bad, yesterday_was_good, meets_engagement_criteria]

  - trigger: progress
    source: TRAINING_2_gratings_flashed
    dest: TRAINING_3_images_G_7ul_reward
    conditions: [two_out_of_three_aint_bad, yesterday_was_good, meets_engagement_criteria]

  - trigger: progress
    source: TRAINING_3_images_G_7ul_reward
    dest: TRAINING_4_images_G_5ul_reward
    conditions: [two_out_of_three_aint_bad, yesterday_was_good, meets_engagement_criteria]

  - trigger: progress
    source: TRAINING_4_images_G_5ul_reward
    dest: TRAINING_5_images_G_3ul_reward
    conditions: [two_out_of_three_aint_bad, yesterday_was_good, meets_engagement_criteria]

  - trigger: progress
    source: TRAINING_5_images_G_3ul_reward
    dest: TRAINING_6_images_G_omissions
    conditions: three_complete

  - trigger: progress
    source: TRAINING_6_images_G_omissions
    dest: TRAINING_7_images_H
    conditions: three_complete

  - trigger: progress
    source: TRAINING_7_images_H
    dest: TRAINING_8_images_H_extinction
    conditions: three_complete

  - trigger: progress
    source: TRAINING_8_images_H_extinction
    dest: PASSIVE_0_movie_clips 
    conditions: one_complete

  - trigger: progress
    source: PASSIVE_0_movie_clips 
    dest: PASSIVE_1_gratings 
    conditions: one_complete


stages:

    TRAINING_0_gratings_autorewards_15min:
        script: *change_detection_script
        script_md5: *change_detection_script_md5
        parameters:
            <<: *no_flash_parameters
            stage: TRAINING_0_gratings_autorewards_15min
            stimulus: *full_field_gratings

            # auto rewards
            warm_up_trials: -1 #infinite
            abort_on_early_response: False
            catch_frequency: 0.0

            response_window: [0.0, 0.0]
            min_no_lick_time: 0.0
            failure_repeats: 0

            max_task_duration_min: 15.0

            reward_volume: 0.0 # autorewards are always 0.005 mL

            start_stop_padding: 300.0
            epilogue: *fingerprint_movie


    TRAINING_1_gratings_static:
        script: *change_detection_script
        script_md5: *change_detection_script_md5
        parameters:
            <<: *no_flash_parameters
            stage: TRAINING_1_gratings_static

            stimulus: *full_field_gratings

            reward_volume: 0.007 # mL
            free_reward_trials: 0
            warm_up_trials: 5

            start_stop_padding: 300.0
            epilogue: *fingerprint_movie


    TRAINING_2_gratings_flashed:
        script: *change_detection_script
        script_md5: *change_detection_script_md5
        parameters:
            <<: *flash_parameters
            stage: TRAINING_2_gratings_flashed
            task_id: DoC

            stimulus: *full_field_gratings
            
            reward_volume: 0.007 # mL
            free_reward_trials: 0
            warm_up_trials: 5 

            start_stop_padding: 300.0
            epilogue: *fingerprint_movie


    TRAINING_3_images_G_7ul_reward:
        script: *change_detection_script
        script_md5: *change_detection_script_md5
        parameters:
            <<: *image_set_g_parameters
            stage: TRAINING_3_images_G_7ul_reward

            reward_volume: 0.007 # mL
            free_reward_trials: 0
            warm_up_trials: 5

            start_stop_padding: 300.0
            epilogue: *fingerprint_movie


    TRAINING_4_images_G_5ul_reward:
        script: *change_detection_script
        script_md5: *change_detection_script_md5
        parameters:
            <<: *image_set_g_parameters
            stage: TRAINING_4_images_G_5ul_reward

            reward_volume: 0.005 # mL
            free_reward_trials: 0
            warm_up_trials: 5

            start_stop_padding: 300.0
            epilogue: *fingerprint_movie


    TRAINING_5_images_G_3ul_reward:
        script: *change_detection_script
        script_md5: *change_detection_script_md5
        parameters:
            <<: *image_set_g_parameters
            stage: TRAINING_5_images_G_3ul_reward

            reward_volume: 0.003 # mL
            free_reward_trials: 0
            warm_up_trials: 5

            start_stop_padding: 300.0
            epilogue: *fingerprint_movie


    TRAINING_6_images_G_omissions:
        script: *change_detection_script
        script_md5: *change_detection_script_md5
        parameters:
            <<: *image_set_g_parameters
            stage: TRAINING_6_images_G_omissions

            reward_volume: 0.003 # mL
            free_reward_trials: 0
            warm_up_trials: 5

            start_stop_padding: 300.0
            epilogue: *fingerprint_movie

            flash_omit_probability: 0.05


    TRAINING_7_images_H:
        script: *change_detection_script
        script_md5: *change_detection_script_md5
        parameters:
            <<: *image_set_h_parameters
            stage: TRAINING_7_images_H

            reward_volume: 0.003 # mL
            free_reward_trials: 0
            warm_up_trials: 5

            start_stop_padding: 300.0
            epilogue: *fingerprint_movie

            flash_omit_probability: 0.05


    TRAINING_8_images_H_extinction:
        script: *change_detection_script
        script_md5: *change_detection_script_md5
        parameters:
            <<: *image_set_h_parameters
            stage: TRAINING_8_images_H_extinction

            reward_volume: 0 
            free_reward_trials: 0
            warm_up_trials: 0

            start_stop_padding: 300.0
            epilogue: *fingerprint_movie

            flash_omit_probability: 0.05
            
    PASSIVE_0_movie_clips:
        script: *script_0
        script_md5: *script_0_md5
        parameters:
            stage: PASSIVE_0_movie_clips

    PASSIVE_1_gratings:
        script: *script_1
        script_md5: *script_1_md5
        parameters:
            stage: PASSIVE_1_gratings


