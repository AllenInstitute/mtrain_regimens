    OPTICAL_SESSION4_SENSORYMOTOR:
        script: *P3_script
        script_md5: *P3_script_md5
        parameters:
            stage: OPTICAL_SESSION4_SENSORYMOTOR
            <<: *bonsai_launcher_parameters
            stimulus_table_duration: 02:00:00
            session_type: sensorimotor_no_oddball_long_zebra
            Photodiode_LocationX: -59

    TEST_P3:
        script: *P3_script
        script_md5: *P3_script_md5
        parameters:
            stage: TEST_P3
            <<: *bonsai_launcher_parameters
            stimulus_table_duration: 00:00:10
