        script_md5: *day_9_script_md5
        parameters:
            stage: DAY_9

    DAY_10:
        script: *day_10_script
        script_md5: *day_10_script_md5
        parameters:
            stage: DAY_10

    TRAIN_60MIN_DAY1_2:
        script: *v2_script
        script_md5: *v2_script_md5
        parameters:
            stage: TRAIN_60MIN_DAY1_2
            dev_mode: False
            nb_runs_ephys_rf: 10
