_change_detection_script: &change_detection_script
    http://stash.corp.alleninstitute.org/projects/VB/repos/visual_behavior_scripts/raw/change_detection_with_fingerprint.py?at=021ec55fbbdbb05aad1681c016e83066fe5aa1dd

_change_detection_script_md5: &change_detection_script_md5
    e0535f3b6f03ccc8eeccaed2118f3c1d

_texture_detection_script: &texture_detection_script
    http://stash.corp.alleninstitute.org/users/jeromel/repos/openscope_texture/raw/active_stimulus.py?at=d4286289cf29ba4324b5358ce91395db863733da

_texture_detection_script_md5: &texture_detection_script_md5
    5e24efe5c55b842b566e6d6e0679e1a0

_full_field_gratings_stimulus: &full_field_gratings
    class: grating
    params:
        sf: 0.04
        tex: sqr
        size: [200, 150,]
        units: deg
        phase: 0.25
    groups:
        vertical:
            Ori: [0, 180]
        horizontal:
            Ori: [90, 270]

_fixed_texture_set_stimulus: &fixed_texture_set
    class: images
    params:
        image_set: //allen/programs/mindscope/workgroups/openscope/2024-Texture/Script/openscope_texture/data/active/OpenScope-Texture_stage-A2.5_240404.pkl
        sampling: even

_sampled_texture_set_stimulus: &sampled_texture_set
    class: images
    params:
        image_set: //allen/programs/mindscope/workgroups/openscope/2024-Texture/Script/openscope_texture/data/active/OpenScope-Texture_stage-A3_240404.pkl
        sampling: even

_flash_parameters: &flash_parameters
    task_id: DoC

    catch_frequency: 0.25
    failure_repeats: 5

    # rewards (mL)
    reward_volume: 0.007
    volume_limit: 5.0

    # auto rewards
    auto_reward_vol: 0.005
    warm_up_trials: 5
    auto_reward_delay: 0.150
    free_reward_trials: 10000

    # trial timing
    min_no_lick_time: 0.0
    timeout_duration: 0.3
    pre_change_time: 0.0
    stimulus_window: 6.0
    max_task_duration_min: 60.0
    start_stop_padding: 20.0
    periodic_flash: [0.25, 0.5]
    response_window: [0.15,0.75]
    end_after_response: True
    end_after_response_sec: 3.5

    # timing of changes
    change_time_dist: geometric
    change_time_scale: 0.3
    change_flashes_min: 4  # inclusive
    change_flashes_max: 12  # exclusive

_no_flash_parameters: &no_flash_parameters
    <<: *flash_parameters
    periodic_flash: null
    response_window: [0.15,1.0]
    reward_volume: 0.010
    free_reward_trials: 10
    pre_change_time: 2.25

    # timing of changes
    change_time_dist: exponential
    change_time_scale: 2.0
    change_flashes_min: null
    change_flashes_max: null


_image_set_fixed_texture_parameters: &image_set_fixed_texture_parameters
    <<: *flash_parameters
    stimulus: *fixed_texture_set
    catch_frequency: null

_image_set_sampled_texture_parameters: &image_set_sampled_texture_parameters
    <<: *flash_parameters
    stimulus: *sampled_texture_set
    catch_frequency: null

### mtrain definitions

name: OpenScope_texture_active_v1

transitions:

  - trigger: progress
    source: TRAINING_0_gratings_autorewards_15min
    dest: TRAINING_1_gratings
    conditions: one_complete

  - trigger: progress
    source: TRAINING_1_gratings
    dest: TRAINING_2_gratings_flashed
    conditions: [two_out_of_three_aint_bad, yesterday_was_good]

  - trigger: progress
    source: TRAINING_2_gratings_flashed
    dest: TRAINING_3_images_fixed_texture_10uL_reward
    conditions: [two_out_of_three_aint_bad, yesterday_was_good]

  - trigger: progress
    source: TRAINING_3_images_fixed_texture_10uL_reward
    dest: TRAINING_4_images_fixed_texture_training
    conditions: three_complete

  - trigger: progress
    source: TRAINING_4_images_fixed_texture_training
    dest: TRAINING_5_images_sampled_texture_training
    conditions: meets_engagement_criteria

stages:

    TRAINING_0_gratings_autorewards_15min:
        script: *change_detection_script
        script_md5: *change_detection_script_md5
        parameters:
            <<: *no_flash_parameters
            stage: TRAINING_0_gratings_autorewards_15min
            stimulus: *full_field_gratings

            # auto rewards
            warm_up_trials: -1 #infinite
            abort_on_early_response: False
            catch_frequency: 0.0

            response_window: [0.0, 0.0]
            min_no_lick_time: 0.0
            failure_repeats: 0

            # trial timing
            max_task_duration_min: 15.0

            # rewards (mL)
            reward_volume: 0.0


    TRAINING_1_gratings:
        script: *change_detection_script
        script_md5: *change_detection_script_md5
        parameters:
            <<: *no_flash_parameters
            stage: TRAINING_1_gratings

            stimulus: *full_field_gratings


    TRAINING_2_gratings_flashed:
        script: *change_detection_script
        script_md5: *change_detection_script_md5
        parameters:
            <<: *flash_parameters
            stage: TRAINING_2_gratings_flashed
            task_id: DoC

            stimulus: *full_field_gratings
            free_reward_trials: 10

            # rewards (mL)
            reward_volume: 0.01


    TRAINING_3_images_fixed_texture_10uL_reward:
        script: *change_detection_script
        script_md5: *change_detection_script_md5
        parameters:
            <<: *image_set_texture_parameters
            stage: TRAINING_3_images_fixed_texture_10uL_reward

            # rewards (mL)
            reward_volume: 0.01
            free_reward_trials: 10


    TRAINING_4_images_fixed_texture_training:
        script: *change_detection_script
        script_md5: *change_detection_script_md5
        parameters:
            <<: *image_set_fixed_texture_parameters
            stage: TRAINING_4_images_fixed_texture_training
            warm_up_trials: 5
            start_stop_padding: 300.0


    TRAINING_5_images_sampled_texture_training:
        script: *texture_detection_script
        script_md5: *texture_detection_script_md5
        parameters:
            <<: *image_set_sampled_texture_parameters
            stage: TRAINING_5_images_sampled_texture_training
            warm_up_trials: 5
            start_stop_padding: 300.0
