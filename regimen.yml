_mapping_movie_list:
- name: gabor
  params:
    frame_length: 0.016666666666666666
    movie_path: 
      //allen/programs/braintv/workgroups/nc-ophys/1022/mapping_stim_movies/gabor-remastered-1576117355.npy
    runs: 5   # 1 min each run
    size: [1920, 1080]

- name: flash
  params:
    frame_length: 0.016666666666666666
    movie_path: 
      //allen/programs/braintv/workgroups/nc-ophys/1022/mapping_stim_movies/flash-remastered-1576272856.npy
    runs: 5   # 1 min each
    size: [1920, 1080]

_flash_parameters: &flash_parameters
  task_id: DoC

  catch_frequency: 0.25
  failure_repeats: 5

  # rewards (mL)
  reward_volume: 0.007
  volume_limit: 5.0

  # auto rewards
  auto_reward_vol: 0.005
  warm_up_trials: 5
  auto_reward_delay: 0.150
  free_reward_trials: 10000

  # trial timing
  min_no_lick_time: 0.0
  timeout_duration: 0.3
  pre_change_time: 0.0
  stimulus_window: 6.0
  max_task_duration_min: 60.0
  periodic_flash: [0.25, 0.5]
  response_window: [0.15, 0.75]
  end_after_response: true
  end_after_response_sec: 3.5

  # timing of changes
  change_time_dist: geometric
  change_time_scale: 0.3
  change_flashes_min: 4 # inclusive
  change_flashes_max: 12 # exclusive

  # start stop padding < 1 can cause a critcally breaking bug
  start_stop_padding: 1

_no_flash_parameters:
  <<: *flash_parameters
  periodic_flash:
  response_window: [0.15, 1.0]
  reward_volume: 0.010
  free_reward_trials: 10
  pre_change_time: 2.25

  # timing of changes
  change_time_dist: exponential
  change_time_scale: 2.0
  change_flashes_min:
  change_flashes_max:

_image_set_g_parameters: &image_set_g_parameters
  <<: *flash_parameters
  stimulus: *image_set_g
  catch_frequency:

_image_set_h_parameters:
  <<: *flash_parameters
  stimulus: *image_set_h
  catch_frequency:

_image_set_k_parameters:
  <<: *flash_parameters
  stimulus: *image_set_k
  catch_frequency:

_replay_g_parameters: &replay_g_parameters
  <<: *flash_parameters
  stimulus: *image_set_g
  catch_frequency:
  mapping:
    flash_path: //allen/programs/braintv/workgroups/nc-ophys/1022/replay-stim/flash_250ms.stim
    gabor_path: 
      //allen/programs/braintv/workgroups/nc-ophys/1022/replay-stim/gabor_20_deg_250ms.stim
  output_dir: C:/ProgramData/AIBS_MPE/camstim/data
  agent_socket: 127.0.0.1:5000

_replay_h_parameters: &replay_h_parameters
