name: Openscope_P3_v13

transitions:

  - trigger: progress
    source: DAY_6
    dest: DAY_7
    conditions: one_complete

  - trigger: progress
    source: DAY_7
    dest: DAY_8
    conditions: one_complete

  - trigger: progress
    source: DAY_8
    dest: DAY_9
    conditions: one_complete

  - trigger: progress
    source: DAY_9
    dest: DAY_10
    conditions: one_complete

  - trigger: manual
    source: DAY_10
    dest: TRAIN_60MIN_DAY1_2

  - trigger: manual
    source: TRAIN_60MIN_DAY1_2
    dest: TRAIN_90MIN_DAY3_4

  - trigger: manual
    source: TRAIN_90MIN_DAY3_4
    dest: TRAIN_120MIN_DAY5

  - trigger: manual
    source: TRAIN_120MIN_DAY5
    dest: EPHYS_PROD_P3

  - trigger: manual
    source: DAY_10
    dest: MESO_PROD_P3

  - trigger: manual
    source: MESO_PROD_P3
    dest: TEST_P3

  - trigger: manual
    source: EPHYS_PROD_P3
    dest: TEST_P3

