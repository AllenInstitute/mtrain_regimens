### mtrain definitions
name: Openscope_texture_passive_v1

transitions:

  - trigger: progress
    source: DAY_6
    dest: DAY_7
    conditions: one_complete

  - trigger: progress
    source: DAY_7
    dest: DAY_8
    conditions: one_complete

  - trigger: progress
    source: DAY_8
    dest: DAY_9
    conditions: one_complete

  - trigger: progress
    source: DAY_9
    dest: DAY_10
    conditions: one_complete

  - trigger: manual
    source: DAY_10
    dest: OPHYS_PROD

  - trigger: manual
    source: OPHYS_PROD
    dest: TEST_STAGE

stages:
    DAY_6:
        script: *passive_script
        script_md5: *passive_script_md5
        parameters:
            stage: DAY_6
            image_repeat: 2
            blank_sweep: 100
            monitor_name: "Gamma1.Luminance50"
            data_folder: //allen/programs/mindscope/workgroups/openscope/2024-Texture/Script/openscope_texture/data/passive

    DAY_7:
        script: *passive_script
        script_md5: *passive_script_md5
        parameters:
            stage: DAY_7
            image_repeat: 4
            blank_sweep: 100
            monitor_name: "Gamma1.Luminance50"
            data_folder: //allen/programs/mindscope/workgroups/openscope/2024-Texture/Script/openscope_texture/data/passive

    DAY_8:
        script: *passive_script
        script_md5: *passive_script_md5
        parameters:
            stage: DAY_8
            image_repeat: 5
            blank_sweep: 100
            monitor_name: "Gamma1.Luminance50"
            data_folder: //allen/programs/mindscope/workgroups/openscope/2024-Texture/Script/openscope_texture/data/passive

    DAY_9:
        script: *passive_script
        script_md5: *passive_script_md5
        parameters:
            stage: DAY_9
            image_repeat: 6
            blank_sweep: 100
            monitor_name: "Gamma1.Luminance50"
            data_folder: //allen/programs/mindscope/workgroups/openscope/2024-Texture/Script/openscope_texture/data/passive

    DAY_10:
        script: *passive_script
        script_md5: *passive_script_md5
        parameters:
            stage: DAY_10
            image_repeat: 8
            blank_sweep: 100
            monitor_name: "Gamma1.Luminance50"
            data_folder: //allen/programs/mindscope/workgroups/openscope/2024-Texture/Script/openscope_texture/data/passive

    OPHYS_PROD:
        script: *passive_script
        script_md5: *passive_script_md5
        parameters:
            stage: OPHYS_PROD
            image_repeat: 10
            blank_sweep: 100
            monitor_name: "Gamma1.Luminance50"
            data_folder: //allen/programs/mindscope/workgroups/openscope/2024-Texture/Script/openscope_texture/data/passive

    TEST_STAGE:
        script: *passive_script
        script_md5: *passive_script_md5
        parameters:
            stage: TEST_STAGE
            image_repeat: 1
            blank_sweep: 1
            monitor_name: "Gamma1.Luminance50"
            data_folder: //allen/programs/mindscope/workgroups/openscope/2024-Texture/Script/openscope_texture/data/passive
