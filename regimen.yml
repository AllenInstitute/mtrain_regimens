### mtrain definitions
name: Openscope_Mousemotion_v19

transitions:

  - trigger: progress
    source: DAY_6
    dest: DAY_7
    conditions: one_complete

  - trigger: progress
    source: DAY_7
    dest: DAY_8
    conditions: one_complete

  - trigger: progress
    source: DAY_8
    dest: DAY_9
    conditions: one_complete

  - trigger: progress
    source: DAY_9
    dest: DAY_10
    conditions: one_complete

  - trigger: manual
    source: DAY_10
    dest: HAB_MOUSEMOTION

  - trigger: manual
    source: HAB_MOUSEMOTION
    dest: ANTERIOR_MOUSEMOTION

  - trigger: manual
    source: ANTERIOR_MOUSEMOTION
    dest: POSTERIOR_MOUSEMOTION

  - trigger: manual
    source: POSTERIOR_MOUSEMOTION
    dest: TEST_MOUSEMOTION

  - trigger: manual
    source: TEST_MOUSEMOTION
    dest: CENTER_MOUSEMOTION

stages:
    DAY_6:
        script: *day_6_script
        script_md5: *day_6_script_md5
        parameters:
            stage: DAY_6

    DAY_7:
        script: *day_7_script
        script_md5: *day_7_script_md5
        parameters:
            stage: DAY_7

    DAY_8:
        script: *day_8_script
        script_md5: *day_8_script_md5
        parameters:
            stage: DAY_8

    DAY_9:
        script: *day_9_script
        script_md5: *day_9_script_md5
        parameters:
            stage: DAY_9

    DAY_10:
        script: *day_10_script
        script_md5: *day_10_script_md5
        parameters:
            stage: DAY_10

    HAB_MOUSEMOTION:
        script: *mousemotion_script
        script_md5: *mousemotion_script_md5
        parameters:
            stage: HAB_MOUSEMOTION
            num_reps: 13
            dev_mode: False
            inter_block_interval: 10
            vertical_pos: 0
            data_folder: //allen/programs/mindscope/workgroups/openscope/2024_mousemotion/data

    CENTER_MOUSEMOTION:
        script: *mousemotion_script
        script_md5: *mousemotion_script_md5
        parameters:
            stage: CENTER_MOUSEMOTION
            num_reps: 22
            dev_mode: False
            inter_block_interval: 10
            vertical_pos: 0
            data_folder: //allen/programs/mindscope/workgroups/openscope/2024_mousemotion/data

    TEST_MOUSEMOTION:
        script: *mousemotion_script
        script_md5: *mousemotion_script_md5
        parameters:
            stage: TEST_MOUSEMOTION
            num_reps: 1
            dev_mode: False
            inter_block_interval: 10
            vertical_pos: 146
            data_folder: //allen/programs/mindscope/workgroups/openscope/2024_mousemotion/data
